pack: memory
description: >-
  The machine's memory and mongod's share of it: /proc/meminfo, tcmalloc and serverStatus.mem.

rules:

  - name: memory.used
    title: "Memory in use"
    doc: >-
      Share of the machine's memory not available to new allocations (MemTotal less MemAvailable, so
      the page cache the kernel can drop counts as free). Host-wide memory or CPU counters do not
      establish a container's resource limit.
    versions: ["4.2.14-4.3", "4.4.5-"]
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      complement: true
      num: ["systemMetrics/memory/MemAvailable_kb"]
      den: ["systemMetrics/memory/MemTotal_kb"]
    levels:
      - {name: low, down: [40, 60]}
      - {name: moderate, band: [40, 60, 75, 85]}
      - {name: high, band: [75, 85, 92, 96]}
      - {name: very_high, up: [92, 96]}
    elevated: 90
    min_change: 10
    pairs_with: [memory.swap_used, memory.page_faults, memory.mongod_resident]

  - name: memory.swap_used
    title: "Swap in use"
    doc: >-
      Share of swap holding pages. Host-wide memory or CPU counters do not establish a container's
      resource limit.
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      complement: true
      num: ["systemMetrics/memory/SwapFree_kb"]
      den: ["systemMetrics/memory/SwapTotal_kb"]
    levels:
      - {name: none, down: [1, 3]}
      - {name: some, band: [1, 3, 20, 40]}
      - {name: heavy, up: [20, 40]}
    elevated: 10
    min_change: 5
    pairs_with: [memory.used, memory.page_faults, memory.swap_in]

  - name: memory.swap_in
    title: "Pages swapped in"
    doc: >-
      Rate of pages the whole machine read back from swap (vmstat pswpin). A process waits for every
      such page it touches, so a burst of it stalls whatever was running, even with swap mostly free.
    signal:
      mode: rate
      unit: "pages/s"
      num: ["systemMetrics/vmstat/pswpin"]
    levels:
      - {name: none, down: [10, 50]}
      - {name: some, band: [10, 50, 500, 1000]}
      - {name: heavy, up: [500, 1000]}
    elevated: 500
    min_change: 50
    pairs_with: [memory.swap_out, memory.page_faults, memory.swap_used]

  - name: memory.swap_out
    title: "Pages swapped out"
    doc: >-
      Rate of pages the whole machine wrote out to swap (vmstat pswpout).
    signal:
      mode: rate
      unit: "pages/s"
      num: ["systemMetrics/vmstat/pswpout"]
    levels:
      - {name: none, down: [10, 50]}
      - {name: some, band: [10, 50, 500, 1000]}
      - {name: heavy, up: [500, 1000]}
    elevated: 500
    min_change: 50
    pairs_with: [memory.swap_in, memory.used, memory.swap_used]

  - name: memory.page_faults
    title: "Page faults"
    doc: >-
      Rate of the process's logged major-page-fault counter.
    signal:
      mode: rate
      unit: "/s"
      num: ["serverStatus/extra_info/page_faults"]
    levels:
      - {name: none, down: [1, 5]}
      - {name: some, band: [1, 5, 50, 200]}
      - {name: heavy, up: [50, 200]}
    elevated: 50
    min_change: 10
    pairs_with: [memory.used, memory.swap_used, disk.read_await]

  - name: memory.mongod_resident
    title: "mongod resident memory"
    doc: >-
      mongod's resident memory as a share of the machine's. Host-wide memory or CPU counters do not
      establish a container's resource limit.
    signal:
      mode: gauge
      unit: "%"
      scale: 102400  # resident is MiB and MemTotal is KiB: x1024, then x100 for a percentage
      num: ["serverStatus/mem/resident"]
      den: ["systemMetrics/memory/MemTotal_kb"]
    levels:
      - {name: modest, down: [40, 60]}
      - {name: large, band: [40, 60, 75, 85]}
      - {name: dominant, up: [75, 85]}
    elevated: 80
    min_change: 5
    pairs_with: [memory.used, memory.heap_outside_cache, memory.cache_of_ram]

  - name: memory.heap_outside_cache
    title: "Allocated bytes minus WiredTiger cache bytes"
    doc: >-
      Difference between tcmalloc allocated bytes and bytes currently held in the WiredTiger cache;
      this is a derived estimate, not a complete inventory of non-cache allocations.
    signal:
      mode: gauge
      unit: "GiB"
      scale: 9.313225746154785e-10  # bytes to GiB
      num: ["serverStatus/tcmalloc/generic/current_allocated_bytes"]
      minus: ["serverStatus/wiredTiger/cache/bytes currently in the cache"]
    min_change: 0.5
    pairs_with: [connections.current, memory.allocator_free, cursors.open]

  - name: memory.allocator_free
    title: "tcmalloc pageheap-free share"
    doc: >-
      Ratio of tcmalloc pageheap_free_bytes to heap_size; these counters do not describe every
      allocator cache.
    until: "8.0"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/tcmalloc/tcmalloc/pageheap_free_bytes"]
      den: ["serverStatus/tcmalloc/generic/heap_size"]
    levels:
      - {name: small, down: [10, 20]}
      - {name: notable, band: [10, 20, 30, 45]}
      - {name: large, up: [30, 45]}
    elevated: 30
    min_change: 5
    pairs_with: [memory.heap_outside_cache, memory.mongod_resident]

  - name: memory.cache_of_ram
    title: "WiredTiger cache size against RAM"
    doc: >-
      The configured cache as a share of the machine's memory. Host-wide memory or CPU counters do
      not establish a container's resource limit.
    signal:
      mode: gauge
      unit: "%"
      scale: 0.09765625  # cache bytes over MemTotal KiB: /1024, then x100
      num: ["serverStatus/wiredTiger/cache/maximum bytes configured"]
      den: ["systemMetrics/memory/MemTotal_kb"]
    levels:
      - {name: low, down: [30, 40]}
      - {name: middle, band: [30, 40, 55, 62]}
      - {name: high, up: [58, 70]}
    elevated: 60
    min_change: 5
    pairs_with: [memory.used, memory.mongod_resident]
