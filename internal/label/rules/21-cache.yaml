pack: storage-engine
description: >-
  WiredTiger behind the ticket pools: its cache, eviction, checkpoints and open handles.

rules:

  - name: cache.fill
    title: "WiredTiger cache fill"
    doc: >-
      Bytes in the WiredTiger cache as a share of its configured size, averaged over the minute.
    reference: {value: 95, unit: "%", source: "WiredTiger default eviction_trigger; eviction_target defaults to 80"}
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: &cache_bytes ["serverStatus/wiredTiger/cache/bytes currently in the cache"]
      den: &cache_size ["serverStatus/wiredTiger/cache/maximum bytes configured"]
    levels:
      - {name: low, down: [50, 70]}
      - {name: normal, band: [50, 70, 80, 86]}
      - {name: high, band: [80, 86, 93, 95]}
      - {name: above_reference, up: [94, 96]}
    elevated: 95
    min_change: 5
    pairs_with: [cache.fill_above_95, cache.app_eviction, cache.read_in]

  - name: cache.fill_above_95
    title: "Cache-fill samples above 95%"
    doc: >-
      Share of valid samples in which WiredTiger cache bytes were strictly above 95 % of the
      configured cache size, normalized to a 60-second minute.
    reference: {value: 95, unit: "%", source: "WiredTiger default eviction_trigger"}
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: *cache_bytes
      den: *cache_size
    view: time_above
    threshold: 95
    levels: &time_levels
      - {name: none, down: [0, 1]}
      - {name: brief, band: [0, 1, 10, 20]}
      - {name: frequent, band: [10, 20, 40, 50]}
      - {name: constant, up: [40, 55]}
    elevated: 1
    min_change: 3
    pairs_with: [cache.fill, cache.app_eviction, tickets.read.scarce]

  - name: cache.dirty
    title: "WiredTiger dirty cache"
    doc: >-
      Modified bytes not yet written, as a share of the configured cache, averaged over the minute.
    reference: {value: 20, unit: "%", source: "WiredTiger default eviction_dirty_trigger; eviction_dirty_target defaults to 5"}
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: &dirty_bytes ["serverStatus/wiredTiger/cache/tracked dirty bytes in the cache"]
      den: *cache_size
    levels:
      - {name: low, down: [3, 6]}
      - {name: normal, band: [3, 6, 8, 12]}
      - {name: high, band: [8, 12, 18, 20]}
      - {name: above_reference, up: [19, 21]}
    elevated: 20
    min_change: 3
    pairs_with: [cache.dirty_above_20, checkpoint.duration, disk.write_await, ops.writes]

  - name: cache.dirty_above_20
    title: "Dirty-cache samples above 20%"
    doc: >-
      Share of valid samples in which tracked dirty bytes were strictly above 20 % of the configured
      cache size, normalized to a 60-second minute.
    reference: {value: 20, unit: "%", source: "WiredTiger default eviction_dirty_trigger"}
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: *dirty_bytes
      den: *cache_size
    view: time_above
    threshold: 20
    levels: *time_levels
    elevated: 1
    min_change: 3
    pairs_with: [cache.dirty, checkpoint.running, tickets.write.scarce]

  # WiredTiger stopped reporting pages evicted by application threads between 8.0.12 (which has it)
  # and 8.0.16 (which reports attempts and failures instead); both checked against real captures.
  - name: cache.app_eviction
    title: "Eviction by application threads"
    doc: >-
      Rate of pages evicted by application threads; where the version uses attempts and failures,
      the signal subtracts failure counts from attempt counts.
    until: "8.0.16"
    signal:
      mode: rate
      unit: "pages/s"
      num: ["serverStatus/wiredTiger/cache/pages evicted by application threads"]
    levels: &app_eviction_levels
      - {name: none, down: [0.1, 1]}
      - {name: some, band: [0.1, 1, 10, 50]}
      - {name: heavy, up: [10, 50]}
    elevated: 1
    min_change: 5
    pairs_with: [cache.fill_above_95, cache.dirty_above_20]

  - name: cache.app_eviction
    title: "Eviction by application threads"
    doc: >-
      Rate of pages evicted by application threads; where the version uses attempts and failures,
      the signal subtracts failure counts from attempt counts.
    since: "8.0.16"
    signal:
      mode: rate
      unit: "pages/s"
      num: ["serverStatus/wiredTiger/cache/page evict attempts by application threads"]
      minus: ["serverStatus/wiredTiger/cache/page evict failures by application threads"]
    levels: *app_eviction_levels
    elevated: 1
    min_change: 5
    pairs_with: [cache.fill_above_95, cache.dirty_above_20, cache.app_eviction_time]

  - name: cache.app_eviction_time
    title: "Time operations spent evicting"
    doc: >-
      Application-thread eviction time counter advance per elapsed second, summed across threads, in
      milliseconds.
    since: "8.0"
    signal:
      mode: rate
      unit: "ms/s"
      scale: 0.001
      num: ["serverStatus/wiredTiger/cache/application thread time evicting (usecs)"]
    levels:
      - {name: none, down: [1, 10]}
      - {name: some, band: [1, 10, 100, 500]}
      - {name: heavy, up: [100, 500]}
    elevated: 100
    min_change: 10
    pairs_with: [cache.app_eviction, cache.fill_above_95, cache.dirty_above_20]

  - name: cache.read_in
    title: "Data read into the cache"
    doc: >-
      WiredTiger bytes-read-into-cache counter advance per elapsed second, scaled to MB/s.
    signal:
      mode: rate
      unit: "MB/s"
      scale: 0.000001
      num: ["serverStatus/wiredTiger/cache/bytes read into cache"]
    min_change: 5
    pairs_with: [disk.read_await, query.collscans, cache.fill]

  # WiredTiger moved its checkpoint statistics out of the transaction section in 7.1.
  - name: checkpoint.duration
    title: "Checkpoint duration"
    doc: >-
      Duration recorded for the most recent WiredTiger checkpoint; the same completed-checkpoint
      value may appear in multiple samples. Minute summaries select the highest valid sample.
    reference: {value: 60, unit: "s", source: "default checkpoint interval, storage.syncPeriodSecs"}
    until: "7.1"
    signal:
      mode: gauge
      unit: "s"
      scale: 0.001
      num: ["serverStatus/wiredTiger/transaction/transaction checkpoint most recent time (msecs)"]
    view: max
    levels: &checkpoint_levels
      - {name: quick, down: [5, 15]}
      - {name: slow, band: [5, 15, 40, 60]}
      - {name: back_to_back, up: [50, 60]}
    elevated: 60
    min_change: 10
    pairs_with: [checkpoint.running, cache.dirty, disk.write_await]

  - name: checkpoint.duration
    title: "Checkpoint duration"
    doc: >-
      Duration recorded for the most recent WiredTiger checkpoint; the same completed-checkpoint
      value may appear in multiple samples. Minute summaries select the highest valid sample.
    reference: {value: 60, unit: "s", source: "default checkpoint interval, storage.syncPeriodSecs"}
    since: "7.1"
    signal:
      mode: gauge
      unit: "s"
      scale: 0.001
      num: ["serverStatus/wiredTiger/checkpoint/most recent time (msecs)"]
    view: max
    levels: *checkpoint_levels
    elevated: 60
    min_change: 10
    pairs_with: [checkpoint.running, cache.dirty, disk.write_await]

  - name: checkpoint.running
    title: "Samples with checkpoint activity"
    doc: >-
      Share of valid samples in which WiredTiger reported a checkpoint as currently running,
      normalized to a 60-second minute.
    until: "7.1"
    signal:
      mode: gauge
      unit: "running"
      num: ["serverStatus/wiredTiger/transaction/transaction checkpoint currently running"]
    view: time_above
    threshold: 0
    levels: &checkpoint_time_levels
      - {name: brief, down: [12, 24]}
      - {name: long, band: [12, 24, 42, 54]}
      - {name: continuous, up: [48, 57]}
    elevated: 48
    min_change: 9
    pairs_with: [checkpoint.duration, disk.busy_above_95, cache.dirty]

  - name: checkpoint.running
    title: "Samples with checkpoint activity"
    doc: >-
      Share of valid samples in which WiredTiger's checkpoint progress state was non-zero,
      normalized to a 60-second minute.
    applies: >-
      The progress state's values are not decoded; any non-zero value is read as activity.
    since: "7.1"
    signal:
      mode: gauge
      unit: "state"
      num: ["serverStatus/wiredTiger/checkpoint/progress state"]
    view: time_above
    threshold: 0
    levels: *checkpoint_time_levels
    elevated: 48
    min_change: 9
    pairs_with: [checkpoint.duration, disk.busy_above_95, cache.dirty]

  - name: storage.open_handles
    title: "Open data handles"
    doc: >-
      Count reported by WiredTiger for currently open data handles.
    signal:
      mode: gauge
      unit: "handles"
      num: ["serverStatus/wiredTiger/data-handle/connection data handles currently active"]
    min_change: 500
