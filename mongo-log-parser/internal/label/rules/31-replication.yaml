pack: replication
description: >-
  The replica set as each node saw it: how far members trailed, whether the majority kept up, and
  whether flow control held writers back.

rules:

  # Lag is read on the worst second of each minute: a member that falls thirty seconds behind and
  # catches up inside the minute still made every w:majority write in it wait.
  - name: repl.member_lag
    title: "Member replication lag"
    doc: >-
      Difference between each member's reported applied-write timestamp and the newest such
      timestamp in this node's replica-set status, scaled to seconds. Members without a timestamp
      have no result. optimeDate has one-second resolution. Minute summaries select the highest
      valid sample.
    applies: >-
      One result per entry of this node's replica-set status, numbered by position in that list; a
      position can name a different member after a reconfig. Lag is measured against the newest
      applied time among members, not against the primary, and a member that stopped reporting keeps
      its last time.
    until: "6.0"
    signal:
      mode: gauge
      unit: "s"
      behind: true
      scale: 0.001
      num: ["replSetGetStatus/members/{i}/optimeDate"]
    view: max
    levels: &lag_levels
      - {name: current, down: [2, 5]}
      - {name: behind, band: [2, 5, 20, 30]}
      - {name: lagging, band: [20, 30, 120, 300]}
      - {name: far_behind, up: [120, 300]}
    elevated: 30
    min_change: 5
    pairs_with: [repl.majority_lag, flow.lagged, net.retransmit]

  - name: repl.member_lag
    title: "Member replication lag"
    doc: >-
      Difference between each member's reported applied-write timestamp and the newest such
      timestamp in this node's replica-set status, scaled to seconds. Members without a timestamp
      have no result. Minute summaries select the highest valid sample.
    applies: >-
      One result per entry of this node's replica-set status, numbered by position in that list; a
      position can name a different member after a reconfig. Lag is measured against the newest
      applied time among members, not against the primary, and a member that stopped reporting keeps
      its last time.
    since: "6.0"
    signal:
      mode: gauge
      unit: "s"
      behind: true
      scale: 0.001
      num: ["replSetGetStatus/members/{i}/lastAppliedWallTime"]
    view: max
    levels: *lag_levels
    elevated: 30
    min_change: 5
    pairs_with: [repl.majority_lag, flow.lagged, net.retransmit]

  - name: repl.majority_lag
    title: "Majority commit lag"
    doc: >-
      Difference between this node's lastAppliedWallTime and lastCommittedWallTime, scaled to
      seconds. Minute summaries select the highest valid sample.
    since: "4.2"
    signal:
      mode: gauge
      unit: "s"
      scale: 0.001
      num: ["replSetGetStatus/optimes/lastAppliedWallTime"]
      minus: ["replSetGetStatus/optimes/lastCommittedWallTime"]
    view: max
    levels:
      - {name: current, down: [1, 3]}
      - {name: behind, band: [1, 3, 10, 20]}
      - {name: lagging, up: [10, 20]}
    elevated: 10
    min_change: 2
    pairs_with: [repl.member_lag, flow.lagged, latency.writes]

  - name: flow.lagged
    title: "Samples with flowControl.isLagged set"
    doc: >-
      Share of valid samples in which flowControl.isLagged was set, normalized to a 60-second
      minute.
    applies: >-
      Set only on a primary with flow control enabled; a secondary, or a primary with flow control
      disabled, reports it unset. The flag records that the majority commit point lagged; time
      writers spent waiting for flow control is flow.wait.
    signal:
      mode: gauge
      unit: "lagged"
      num: ["serverStatus/flowControl/isLagged"]
    view: time_above
    threshold: 0
    levels:
      - {name: none, down: [0, 1]}
      - {name: some, band: [0, 1, 30, 48]}
      - {name: most, up: [30, 48]}
    elevated: 1
    min_change: 3
    pairs_with: [flow.wait, repl.majority_lag, latency.writes]

  - name: flow.wait
    title: "Time writers waited on flow control"
    doc: >-
      Milliseconds a second writes spent waiting for flow control tickets on this node, added across
      every write waiting.
    signal:
      mode: rate
      unit: "ms/s"
      scale: 0.001
      num: ["serverStatus/flowControl/timeAcquiringMicros"]
    levels:
      - {name: none, down: [1, 10]}
      - {name: some, band: [1, 10, 100, 500]}
      - {name: heavy, up: [100, 500]}
    elevated: 100
    min_change: 10
    pairs_with: [flow.lagged, latency.writes]

  - name: repl.apply_rate
    title: "Oplog entries applied"
    doc: >-
      Rate of the node's oplog application operation counter.
    direction: down
    signal:
      mode: rate
      unit: "ops/s"
      num: ["serverStatus/metrics/repl/apply/ops"]
    min_change: 50
    pairs_with: [repl.buffer_fill, repl.member_lag]

  # 8.0 split the buffer into a write buffer and an apply buffer; the apply side is the one that
  # fills when the node cannot apply what it fetched.
  - name: repl.buffer_fill
    title: "Apply buffer fill"
    doc: >-
      Reported replication buffer bytes as a share of its reported maximum.
    until: "8.0"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/metrics/repl/buffer/sizeBytes"]
      den: ["serverStatus/metrics/repl/buffer/maxSizeBytes"]
    levels: &buffer_levels
      - {name: empty, down: [5, 20]}
      - {name: filling, band: [5, 20, 60, 85]}
      - {name: full, up: [70, 90]}
    elevated: 70
    min_change: 10
    pairs_with: [repl.buffer_full, repl.apply_rate, repl.member_lag]

  - name: repl.buffer_fill
    title: "Apply buffer fill"
    doc: >-
      Reported replication buffer bytes as a share of its reported maximum.
    since: "8.0"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/metrics/repl/buffer/apply/sizeBytes"]
      den: ["serverStatus/metrics/repl/buffer/apply/maxSizeBytes"]
    levels: *buffer_levels
    elevated: 70
    min_change: 10
    pairs_with: [repl.buffer_full, repl.apply_rate, repl.member_lag]

  - name: repl.buffer_full
    title: "Apply-buffer samples above 90%"
    doc: >-
      Share of valid samples in which replication buffer bytes were strictly above 90 % of the
      reported maximum, normalized to a 60-second minute.
    until: "8.0"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/metrics/repl/buffer/sizeBytes"]
      den: ["serverStatus/metrics/repl/buffer/maxSizeBytes"]
    view: time_above
    threshold: 90
    levels: &time_levels
      - {name: none, down: [0, 1]}
      - {name: brief, band: [0, 1, 10, 20]}
      - {name: frequent, band: [10, 20, 40, 50]}
      - {name: constant, up: [40, 55]}
    elevated: 1
    min_change: 3
    pairs_with: [repl.buffer_fill, repl.apply_rate]

  - name: repl.buffer_full
    title: "Apply-buffer samples above 90%"
    doc: >-
      Share of valid samples in which replication buffer bytes were strictly above 90 % of the
      reported maximum, normalized to a 60-second minute.
    since: "8.0"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/metrics/repl/buffer/apply/sizeBytes"]
      den: ["serverStatus/metrics/repl/buffer/apply/maxSizeBytes"]
    view: time_above
    threshold: 90
    levels: *time_levels
    elevated: 1
    min_change: 3
    pairs_with: [repl.buffer_fill, repl.apply_rate]
