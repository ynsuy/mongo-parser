pack: connections
description: >-
  Client connections against the limit, and how fast they are opened. The limit is read like a
  ticket pool: how much of it was in use, and how long it spent nearly exhausted.

rules:

  - name: connections.used
    title: "Current connections as a share of current plus available"
    doc: >-
      Reported current connections divided by current plus available connections.
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/connections/current"]
      den: &conn_limit ["serverStatus/connections/current", "serverStatus/connections/available"]
    levels:
      - {name: low, down: [25, 50]}
      - {name: moderate, band: [25, 50, 70, 85]}
      - {name: high, band: [70, 85, 90, 95]}
      - {name: near_limit, up: [90, 95]}
    elevated: 85
    min_change: 10
    pairs_with: [connections.scarce, connections.created, connections.rejected]

  - name: connections.scarce
    title: "Samples with under 10% of connections left"
    doc: >-
      Share of valid samples in which available connections were strictly below 10 % of current plus
      available, normalized to a 60-second minute.
    signal:
      mode: gauge
      unit: "% available"
      scale: 100
      num: ["serverStatus/connections/available"]
      den: *conn_limit
    view: time_below
    threshold: 10
    levels:
      - {name: none, down: [0, 1]}
      - {name: brief, band: [0, 1, 10, 20]}
      - {name: frequent, band: [10, 20, 40, 50]}
      - {name: constant, up: [40, 55]}
    elevated: 1
    min_change: 3
    open_at: brief
    pairs_with: [connections.used, connections.created, connections.rejected]

  - name: connections.created
    title: "New connections"
    doc: >-
      Rate of the server's totalCreated connection counter.
    signal:
      mode: rate
      unit: "conn/s"
      num: ["serverStatus/connections/totalCreated"]
    levels:
      - {name: quiet, down: [1, 3]}
      - {name: normal, band: [1, 3, 10, 20]}
      - {name: high, up: [10, 20]}
    elevated: 20
    min_change: 5
    pairs_with: [connections.current, cpu.kernel_share, net.resets]

  # "active" counts every connection with an operation in progress, and that includes each driver's
  # monitoring connections parked in an awaitable hello (awaitingTopologyChanges). They are not work,
  # so they are taken out of both labels below.
  - name: connections.non_active
    title: "Derived non-active connection count"
    doc: >-
      Derived connection count: current plus awaitingTopologyChanges minus active; it is not
      evidence of unused client pools or a connection leak.
    since: "4.4"
    signal:
      mode: gauge
      unit: "conns"
      num: ["serverStatus/connections/current", "serverStatus/connections/awaitingTopologyChanges"]
      minus: ["serverStatus/connections/active"]
    levels:
      - {name: few, down: [300, 800]}
      - {name: many, band: [300, 800, 1500, 2500]}
      - {name: very_high, up: [1500, 3000]}
    elevated: 2000
    min_change: 100
    pairs_with: [connections.current, connections.created, connections.working_share, memory.heap_outside_cache]

  - name: connections.working_share
    title: "Derived active-connection share"
    doc: >-
      Derived active-connection share: active minus awaitingTopologyChanges divided by current
      connections. Minute summaries select the highest valid sample.
    since: "4.4"
    signal:
      mode: gauge
      unit: "%"
      scale: 100
      num: ["serverStatus/connections/active"]
      minus: ["serverStatus/connections/awaitingTopologyChanges"]
      den: ["serverStatus/connections/current"]
      min_den: 3000
    view: max
    levels:
      - {name: calm, down: [10, 25]}
      - {name: busy, band: [10, 25, 40, 60]}
      - {name: high, up: [40, 60]}
    elevated: 40
    min_change: 10
    pairs_with: [tickets.read.empty, tickets.write.empty, queue.readers, queue.writers, connections.created]

  - name: connections.current
    title: "Open connections"
    doc: >-
      Count reported for currently open server connections.
    signal:
      mode: gauge
      unit: "conns"
      num: ["serverStatus/connections/current"]
    min_change: 50
    pairs_with: [connections.non_active, connections.created, memory.heap_outside_cache]

  - name: connections.rejected
    title: "Connections refused"
    doc: >-
      Rate of the server's rejected connection counter; client impact and rejection cause are not
      inferred.
    since: "6.3"
    signal:
      mode: rate
      unit: "/s"
      num: ["serverStatus/connections/rejected"]
    levels:
      - {name: none, down: [0.001, 0.01]}
      - {name: some, band: [0.001, 0.01, 1, 5]}
      - {name: many, up: [1, 5]}
    elevated: 0.01
    min_change: 0.01
    pairs_with: [connections.scarce, connections.used]
