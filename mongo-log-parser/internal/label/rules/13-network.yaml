pack: network
description: >-
  The TCP stack, host-wide: what mongod cannot see of the network it talks over.

rules:

  - name: net.retransmit
    title: "TCP retransmission"
    doc: >-
      Ratio of the host TCP RetransSegs counter advance to the OutSegs counter advance, across host
      connections. Minute summaries use a ratio of sums for ratio signals and a mean otherwise.
      Numeric bands and thresholds are fixed descriptive references, not a diagnosis or a discovered
      server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "%"
      scale: 100
      min_den: 1000
      num: ["systemMetrics/netstat/Tcp:RetransSegs"]
      den: ["systemMetrics/netstat/Tcp:OutSegs"]
    levels:
      - {name: low, down: [0.1, 0.3]}
      - {name: moderate, band: [0.1, 0.3, 0.7, 1]}
      - {name: high, band: [0.7, 1, 2, 3]}
      - {name: very_high, up: [2, 3]}
    elevated: 1
    min_change: 0.5
    pairs_with: [repl.member_lag, net.resets]

  - name: net.listen_overflows
    title: "Listen queue overflows"
    doc: >-
      Rate of the host TCP ListenOverflows counter; the counter does not identify a MongoDB connection
      or client outcome. Minute summaries use a ratio of sums for ratio signals and a mean otherwise.
      Numeric bands and thresholds are fixed descriptive references, not a diagnosis or a discovered
      server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "/s"
      num: ["systemMetrics/netstat/TcpExt:ListenOverflows"]
    levels:
      - {name: none, down: [0.01, 0.1]}
      - {name: some, band: [0.01, 0.1, 1, 5]}
      - {name: many, up: [1, 5]}
    elevated: 0.1
    min_change: 0.1
    pairs_with: [connections.created, cpu.saturated]

  - name: net.resets
    title: "TCP connections reset"
    doc: >-
      Established connections reset a second, host-wide. Minute summaries use a ratio of sums for
      ratio signals and a mean otherwise. Numeric bands and thresholds are fixed descriptive
      references, not a diagnosis or a discovered server limit. Paired labels are navigation links,
      not causal claims.
    signal:
      mode: rate
      unit: "/s"
      num: ["systemMetrics/netstat/Tcp:EstabResets"]
    min_change: 5
    pairs_with: [connections.created, net.retransmit]

  - name: net.traffic
    title: "mongod network traffic"
    doc: >-
      Sum of the server's bytesIn and bytesOut counter rates, scaled to MB/s. Minute summaries use a
      ratio of sums for ratio signals and a mean otherwise. Numeric bands and thresholds are fixed
      descriptive references, not a diagnosis or a discovered server limit. Paired labels are
      navigation links, not causal claims.
    signal:
      mode: rate
      unit: "MB/s"
      scale: 0.000001
      num: ["serverStatus/network/bytesIn", "serverStatus/network/bytesOut"]
    min_change: 5
    pairs_with: [ops.total, net.retransmit]
