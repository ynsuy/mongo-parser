pack: workload
description: >-
  What clients asked the server to do, and how long it took.

rules:

  - name: latency.reads
    title: "Read latency"
    doc: >-
      Average milliseconds per read operation over each minute, from opLatencies: every microsecond
      spent on reads in the minute over every read that finished in it.
    signal:
      mode: rate
      unit: "ms"
      scale: 0.001
      min_den: 60
      num: ["serverStatus/opLatencies/reads/latency"]
      den: ["serverStatus/opLatencies/reads/ops"]
    levels: &latency_levels
      - {name: fast, down: [1, 3]}
      - {name: normal, band: [1, 3, 10, 20]}
      - {name: slow, band: [10, 20, 50, 100]}
      - {name: very_slow, up: [50, 100]}
    elevated: 50
    min_change: 5
    pairs_with: [tickets.read.scarce, query.targeting, cache.fill_above_95, disk.read_await]

  - name: latency.writes
    title: "Write latency"
    doc: >-
      Average milliseconds per write operation over each minute, from opLatencies.
    signal:
      mode: rate
      unit: "ms"
      scale: 0.001
      min_den: 60
      num: ["serverStatus/opLatencies/writes/latency"]
      den: ["serverStatus/opLatencies/writes/ops"]
    levels: *latency_levels
    elevated: 50
    min_change: 5
    pairs_with: [tickets.write.scarce, cache.dirty_above_20, flow.lagged, repl.majority_lag]

  - name: latency.commands
    title: "Command latency"
    doc: >-
      Ratio of command opLatencies counter advance to command operation-count advance, scaled to
      milliseconds per operation.
    signal:
      mode: rate
      unit: "ms"
      scale: 0.001
      min_den: 60
      num: ["serverStatus/opLatencies/commands/latency"]
      den: ["serverStatus/opLatencies/commands/ops"]
    levels: *latency_levels
    elevated: 50
    min_change: 5
    pairs_with: [tickets.read.scarce, query.targeting]

  - name: ops.total
    title: "Operations a second"
    doc: >-
      Sum of query, getMore, insert, update, delete and command operation-counter rates.
    signal:
      mode: rate
      unit: "ops/s"
      num: ["serverStatus/opcounters/query", "serverStatus/opcounters/getmore", "serverStatus/opcounters/insert",
            "serverStatus/opcounters/update", "serverStatus/opcounters/delete", "serverStatus/opcounters/command"]
    min_change: 50
    pairs_with: [ops.writes, connections.current]

  - name: ops.writes
    title: "Writes a second"
    doc: >-
      Sum of insert, update and delete operation-counter rates.
    signal:
      mode: rate
      unit: "ops/s"
      num: ["serverStatus/opcounters/insert", "serverStatus/opcounters/update", "serverStatus/opcounters/delete"]
    min_change: 50
    pairs_with: [cache.dirty, checkpoint.duration]

  - name: query.targeting
    title: "Documents examined per document returned"
    doc: >-
      Ratio of documents-examined counter advance to documents-returned counter advance; it does not
      determine index suitability.
    signal:
      mode: rate
      unit: "ratio"
      min_den: 60
      num: ["serverStatus/metrics/queryExecutor/scannedObjects"]
      den: ["serverStatus/metrics/document/returned"]
    levels:
      - {name: low, down: [2, 10]}
      - {name: moderate, band: [2, 10, 50, 100]}
      - {name: high, band: [50, 100, 500, 1000]}
      - {name: very_high, up: [500, 1000]}
    elevated: 100
    min_change: 10
    pairs_with: [query.collscans, cache.read_in, cpu.busy]

  - name: query.collscans
    title: "Collection scans"
    doc: >-
      Rate of the server's collection-scan counter.
    since: "4.4"
    signal:
      mode: rate
      unit: "/s"
      num: ["serverStatus/metrics/queryExecutor/collectionScans/total"]
    levels:
      - {name: none, down: [0.01, 0.1]}
      - {name: some, band: [0.01, 0.1, 1, 10]}
      - {name: many, up: [1, 10]}
    elevated: 1
    min_change: 0.5
    pairs_with: [query.targeting, cache.read_in]

  - name: query.scan_and_order
    title: "scanAndOrder counter rate"
    doc: >-
      Rate of the server's scanAndOrder counter.
    signal:
      mode: rate
      unit: "/s"
      num: ["serverStatus/metrics/operation/scanAndOrder"]
    min_change: 1
    pairs_with: [query.targeting, memory.heap_outside_cache]

  - name: writes.conflicts
    title: "Write conflicts"
    doc: >-
      Rate of the server's writeConflicts counter; retries, document identity and contention cause
      are not inferred from this counter.
    signal:
      mode: rate
      unit: "/s"
      num: ["serverStatus/metrics/operation/writeConflicts"]
    levels:
      - {name: rare, down: [0.1, 1]}
      - {name: some, band: [0.1, 1, 10, 50]}
      - {name: heavy, up: [10, 50]}
    elevated: 10
    min_change: 2
    pairs_with: [ops.writes, latency.writes]

  - name: ttl.deletes
    title: "Documents deleted by TTL"
    doc: >-
      Rate of documents reported deleted by the TTL monitor; collection identity, expiry backlog and
      latency impact are not inferred.
    signal:
      mode: rate
      unit: "docs/s"
      num: ["serverStatus/metrics/ttl/deletedDocuments"]
    min_change: 50
    pairs_with: [cache.dirty, disk.write_await, repl.member_lag]

  - name: cursors.open
    title: "Open cursors"
    doc: >-
      Count reported for currently open cursors.
    signal:
      mode: gauge
      unit: "cursors"
      num: ["serverStatus/metrics/cursor/open/total"]
    min_change: 50
    pairs_with: [memory.heap_outside_cache, connections.current]
