pack: disk
description: >-
  Block devices, one result per real device.

rules:

  - name: disk.busy
    title: "Disk busy"
    doc: >-
      Device io_time counter advance divided by elapsed time; a high value does not establish device
      capacity exhaustion. Device coverage depends on the block-device counters present in FTDC;
      logical devices may be absent. Minute summaries use a ratio of sums for ratio signals and a mean
      otherwise. Numeric bands and thresholds are fixed descriptive references, not a diagnosis or a
      discovered server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "%"
      scale: 0.1  # milliseconds busy a second, as a percentage
      real_device: true
      num: ["systemMetrics/disks/{i}/io_time_ms"]
    levels:
      - {name: idle, down: [5, 15]}
      - {name: low, band: [5, 15, 40, 60]}
      - {name: moderate, band: [40, 60, 75, 85]}
      - {name: high, band: [75, 85, 92, 97]}
      - {name: very_high, up: [92, 97]}
    elevated: 85
    min_change: 15
    pairs_with: [disk.saturated, disk.await, disk.queue, disk.iops, disk.throughput]
    open_with: [disk.await]

  - name: disk.saturated
    title: "Device-busy samples above 95%"
    doc: >-
      Share of valid samples with the signal strictly above 95 %, normalized to a 60-second minute.
      This is a normalized sample share, not measured continuous elapsed duration; cadence and gaps
      must be checked. Numeric bands and thresholds are fixed descriptive references, not a diagnosis
      or a discovered server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "%"
      scale: 0.1
      real_device: true
      num: ["systemMetrics/disks/{i}/io_time_ms"]
    view: time_above
    threshold: 95
    levels:
      - {name: none, down: [0, 1]}
      - {name: brief, band: [0, 1, 10, 20]}
      - {name: frequent, band: [10, 20, 40, 50]}
      - {name: constant, up: [40, 55]}
    elevated: 1
    min_change: 3
    pairs_with: [disk.busy, disk.await, checkpoint.running]
    open_with: [disk.await]

  - name: disk.await
    title: "Disk time per request"
    doc: >-
      Average milliseconds a read or write took on each device, queueing included — what iostat calls
      await. Minute summaries use a ratio of sums for ratio signals and a mean otherwise. Numeric
      bands and thresholds are fixed descriptive references, not a diagnosis or a discovered server
      limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "ms"
      min_den: 60
      real_device: true
      num: ["systemMetrics/disks/{i}/read_time_ms", "systemMetrics/disks/{i}/write_time_ms"]
      den: ["systemMetrics/disks/{i}/reads", "systemMetrics/disks/{i}/writes"]
    levels: &await_levels
      - {name: fast, down: [2, 5]}
      - {name: normal, band: [2, 5, 10, 15]}
      - {name: slow, band: [10, 15, 30, 50]}
      - {name: very_slow, up: [30, 50]}
    elevated: 20
    min_change: 5
    pairs_with: [disk.busy, disk.queue, cpu.iowait]

  - name: disk.read_await
    title: "Disk time per read"
    doc: >-
      Average milliseconds a read took on each device. Minute summaries use a ratio of sums for ratio
      signals and a mean otherwise. Numeric bands and thresholds are fixed descriptive references, not
      a diagnosis or a discovered server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "ms"
      min_den: 60
      real_device: true
      num: ["systemMetrics/disks/{i}/read_time_ms"]
      den: ["systemMetrics/disks/{i}/reads"]
    levels: *await_levels
    elevated: 20
    min_change: 5
    pairs_with: [cache.read_in, disk.busy]

  - name: disk.write_await
    title: "Disk time per write"
    doc: >-
      Average milliseconds a write took on each device. Minute summaries use a ratio of sums for ratio
      signals and a mean otherwise. Numeric bands and thresholds are fixed descriptive references, not
      a diagnosis or a discovered server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "ms"
      min_den: 60
      real_device: true
      num: ["systemMetrics/disks/{i}/write_time_ms"]
      den: ["systemMetrics/disks/{i}/writes"]
    levels: *await_levels
    elevated: 20
    min_change: 5
    pairs_with: [checkpoint.duration, cache.dirty, tickets.write.scarce]

  - name: disk.queue
    title: "Disk requests in flight"
    doc: >-
      Average number of requests outstanding on each device over the minute (io_queued time over wall
      time). Minute summaries use a ratio of sums for ratio signals and a mean otherwise. Numeric
      bands and thresholds are fixed descriptive references, not a diagnosis or a discovered server
      limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "requests"
      scale: 0.001
      real_device: true
      num: ["systemMetrics/disks/{i}/io_queued_ms"]
    levels:
      - {name: shallow, down: [1, 2]}
      - {name: moderate, band: [1, 2, 8, 16]}
      - {name: deep, up: [8, 16]}
    elevated: 8
    min_change: 2
    pairs_with: [disk.await, disk.busy]
    open_with: [disk.await]

  - name: disk.iops
    title: "Disk requests a second"
    doc: >-
      Reads plus writes a second on each device. Minute summaries use a ratio of sums for ratio
      signals and a mean otherwise. Numeric bands and thresholds are fixed descriptive references, not
      a diagnosis or a discovered server limit. Paired labels are navigation links, not causal claims.
    signal:
      mode: rate
      unit: "/s"
      real_device: true
      num: ["systemMetrics/disks/{i}/reads", "systemMetrics/disks/{i}/writes"]
    min_change: 100
    pairs_with: [disk.busy, disk.await]

  - name: disk.throughput
    title: "Disk throughput"
    doc: >-
      Megabytes a second read plus written on each device (sectors are 512 bytes). Minute summaries
      use a ratio of sums for ratio signals and a mean otherwise. Numeric bands and thresholds are
      fixed descriptive references, not a diagnosis or a discovered server limit. Paired labels are
      navigation links, not causal claims.
    signal:
      mode: rate
      unit: "MB/s"
      scale: 0.000512  # sectors of 512 bytes to MB
      real_device: true
      num: ["systemMetrics/disks/{i}/read_sectors", "systemMetrics/disks/{i}/write_sectors"]
    min_change: 10
    pairs_with: [disk.busy, disk.iops]
