# A mongo-log-parser/vX.Y.Z tag publishes the binaries the mongo-diagnoser plugin downloads.
name: release mongo-log-parser

on:
  push:
    tags: ["mongo-log-parser/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: mongo-log-parser/go.mod
          cache-dependency-path: mongo-log-parser/go.sum
      - name: test
        run: go -C mongo-log-parser test ./...
      - name: build
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              mongo-log-parser/scripts/build.sh "$PWD/dist/mongo-log-parser_${target%/*}_${target#*/}"
          done
          (cd dist && sha256sum mongo-log-parser_* > checksums.txt)
      - name: check the plugin asks for this release
        run: |
          for manifest in plugin/.claude-plugin/plugin.json plugin/plugin.json; do
            plugin="$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' "$manifest" | head -1)"
            test "mongo-log-parser/v$plugin" = "$GITHUB_REF_NAME"
          done
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
